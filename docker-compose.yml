# Runs a Postgres database inside Docker so I don't have to install it on my Mac.
# Start it with:  docker compose up -d
# Stop it with:   docker compose down      (my data is kept)
# Wipe it with:   docker compose down -v   (deletes the data too)

services:
  postgres:
    image: postgres:16
    container_name: food_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

# a named volume keeps the database data even when the container stops
volumes:
  pgdata: